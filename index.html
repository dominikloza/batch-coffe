<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch No. 9 — Poznaj Swoją Kawę</title>
<meta name="description" content="Batch No. 9 — rzemieślnicza palarnia kawy specialty. Prawdziwa, uczciwa, w pełni śledzalna kawa — od plantacji po Twoją filiżankę.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ivory: '#FAF9F6',
          terracotta: { DEFAULT: '#E2725B', dark: '#C65A44', light: '#E9B29F' },
          rust: '#8B4530',
          espresso: '#2B1700',
        },
        fontFamily: {
          display: ['Rye', 'serif'],
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  html { overflow-x: hidden; }
  body { background-color: #FAF9F6; color: #2B1700; overflow-x: hidden; }

  /* Layered "3D" vintage-sign heading effect, tuned per background context */
  .text-3d { text-shadow: 0.05em 0.05em 0 var(--ts1), 0.1em 0.1em 0 var(--ts2); }
  .on-espresso { --ts1: #6b4527; --ts2: #472c16; }
  .on-ivory { --ts1: #E9B29F; --ts2: #E2725B; }
  .on-terracotta { --ts1: #2B1700; --ts2: #472c16; }
  .on-terracotta-light { --ts1: #C65A44; --ts2: #8B4530; }
  .on-rust { --ts1: #5c2b1c; --ts2: #2B1700; }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }

  /* Marquee ticker */
  .marquee-track { display: flex; width: max-content; animation: marquee 20s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Decorative flying bean */
  .bean-float { animation: bean-float 3.5s ease-in-out infinite; }
  @keyframes bean-float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(6px, -10px) rotate(12deg); }
  }

  /* Preloader */
  #preloader {
    position: fixed; inset: 0; z-index: 100;
    background-color: #E2725B; color: #FAF9F6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #preloader-bean {
    animation: preloader-path 1.8s ease-in-out infinite;
  }
  @keyframes preloader-path {
    0% { transform: translateX(-90px) translateY(0) rotate(-10deg); }
    25% { transform: translateX(-30px) translateY(-16px) rotate(10deg); }
    50% { transform: translateX(30px) translateY(0) rotate(-10deg); }
    75% { transform: translateX(70px) translateY(-16px) rotate(10deg); }
    100% { transform: translateX(110px) translateY(0) rotate(-10deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; opacity: 1; transform: none; }
    .marquee-track, .bean-float, #preloader-bean { animation: none; }
  }
</style>
</head>
<body class="font-sans text-espresso bg-ivory antialiased">

<!-- ===== PRELOADER ===== -->
<div id="preloader" aria-hidden="true">
  <p class="text-xs sm:text-sm font-semibold uppercase tracking-[0.3em] mb-10">Parzenie się rozpoczyna&hellip;</p>
  <div class="relative w-48 sm:w-64 h-10 flex items-center justify-center mb-10">
    <svg id="preloader-bean" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="13" cy="13" rx="11" ry="8" transform="rotate(-40 13 13)" fill="#2B1700"/>
      <path d="M6 17c3-5 4-9 3-13" stroke="#FAF9F6" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>
  <p id="preloader-pct" class="font-display text-4xl sm:text-5xl leading-none">0%</p>
  <p class="mt-4 text-[11px] sm:text-xs font-semibold uppercase tracking-[0.2em] text-ivory/80">Przygotuj się na prawdziwą, uczciwą kawę&trade;.</p>
</div>

<!-- ===== HEADER / NAV ===== -->
<header id="top" class="relative bg-espresso text-ivory">
  <div class="max-w-[1800px] mx-auto px-5 sm:px-8 lg:px-10">
    <div class="flex items-center justify-between h-20 md:h-24">
      <!-- Desktop nav left -->
      <nav class="hidden md:flex items-center gap-8 text-xs font-semibold uppercase tracking-widest">
        <a href="#kawa" class="hover:text-terracotta-light transition-colors">Śledź Kawę</a>
        <a href="#produkty" class="hover:text-terracotta-light transition-colors">Produkty</a>
        <a href="#palarnia" class="hover:text-terracotta-light transition-colors">Palarnia na Żywo</a>
      </nav>

      <!-- Logo badge -->
      <a href="#top" class="absolute left-1/2 -translate-x-1/2 flex items-center" aria-label="Batch No. 9 - strona główna">
        <svg width="150" height="52" viewBox="0 0 150 52" class="sm:w-[170px]" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 10 L144 10 L138 26 L144 42 L6 42 L12 26 Z" fill="#EDE6D6" stroke="#2B1700" stroke-width="1.5"/>
          <text x="75" y="31" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#2B1700" letter-spacing="0.5">BATCH No.9</text>
        </svg>
      </a>

      <!-- Desktop nav right -->
      <nav class="hidden md:flex items-center gap-8 text-xs font-semibold uppercase tracking-widest">
        <a href="#onas" class="hover:text-terracotta-light transition-colors">O Nas</a>
        <a href="#przepisy" class="hover:text-terracotta-light transition-colors">Przepisy</a>
        <a href="#gdziekupic" class="hover:text-terracotta-light transition-colors">Gdzie Kupić</a>
      </nav>

      <!-- Mobile menu button -->
      <button id="menu-btn" aria-label="Otwórz menu" aria-expanded="false" class="md:hidden ml-auto inline-flex items-center justify-center w-10 h-10 rounded-full border border-ivory/25">
        <svg id="icon-open" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#FAF9F6" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <svg id="icon-close" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="#FAF9F6" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu panel -->
  <div id="mobile-menu" class="md:hidden hidden border-t border-ivory/10 bg-espresso">
    <nav class="flex flex-col px-5 py-4 gap-1 text-sm font-semibold uppercase tracking-widest">
      <a href="#kawa" class="py-2.5">Śledź Kawę</a>
      <a href="#produkty" class="py-2.5">Produkty</a>
      <a href="#palarnia" class="py-2.5">Palarnia na Żywo</a>
      <a href="#onas" class="py-2.5">O Nas</a>
      <a href="#przepisy" class="py-2.5">Przepisy</a>
      <a href="#gdziekupic" class="py-2.5">Gdzie Kupić</a>
    </nav>
  </div>
</header>

<main>

<!-- ===== HERO ===== -->
<section id="hero" class="relative bg-espresso text-ivory pb-0 overflow-hidden">
  <div class="max-w-[1800px] mx-auto px-5 sm:px-8 lg:px-10 pt-8 sm:pt-14 pb-8">
    <h1 class="reveal text-3d on-espresso font-display text-center leading-[0.95] tracking-wide text-[15vw] sm:text-[10vw] lg:text-[7.2vw] whitespace-normal">
      POZNAJ<br class="sm:hidden"> <span class="inline">SWOJĄ</span><br class="sm:hidden"> KAWĘ
    </h1>

    <div class="relative flex items-center justify-between mt-2 sm:mt-4 px-1 sm:px-6">
      <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-[0.15em] max-w-[9rem] sm:max-w-none">Smak, który<br class="sm:hidden"> można prześledzić.</p>
      <svg class="bean-float absolute left-1/2 -translate-x-1/2 -top-3 sm:top-0" width="18" height="18" viewBox="0 0 26 26" fill="none">
        <ellipse cx="13" cy="13" rx="11" ry="8" transform="rotate(-40 13 13)" fill="#E9B29F"/>
        <path d="M6 17c3-5 4-9 3-13" stroke="#2B1700" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-[0.15em] text-right max-w-[9rem] sm:max-w-none">Prosto z serca<br class="sm:hidden"> palarni.</p>
    </div>
  </div>

  <div class="reveal relative max-w-md sm:max-w-lg mx-auto px-8 pb-14 sm:pb-20">
    <div class="relative aspect-[3/4] rounded-t-[3rem] overflow-hidden ring-1 ring-ivory/10">
      <img src="https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=1200&auto=format&fit=crop"
           alt="Torebka świeżo wypalonej kawy specialty Batch No. 9"
           class="w-full h-full object-cover" loading="eager">
    </div>
    <svg class="bean-float absolute -right-2 top-1/4 hidden sm:block" width="20" height="20" viewBox="0 0 26 26" fill="none">
      <ellipse cx="13" cy="13" rx="11" ry="8" transform="rotate(-40 13 13)" fill="#E2725B"/>
      <path d="M6 17c3-5 4-9 3-13" stroke="#FAF9F6" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
  </div>
</section>

</main>

<script>
  // Preloader counter
  (function () {
    const preloader = document.getElementById('preloader');
    const pct = document.getElementById('preloader-pct');
    let value = 0;
    const timer = setInterval(() => {
      value += Math.ceil(Math.random() * 18) + 4;
      if (value >= 100) {
        value = 100;
        clearInterval(timer);
        setTimeout(() => preloader.classList.add('hidden'), 300);
      }
      pct.textContent = value + '%';
    }, 140);
  })();

  // Mobile menu toggle
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  const iconOpen = document.getElementById('icon-open');
  const iconClose = document.getElementById('icon-close');
  if (menuBtn) {
    menuBtn.addEventListener('click', () => {
      const isOpen = !mobileMenu.classList.contains('hidden');
      mobileMenu.classList.toggle('hidden');
      iconOpen.classList.toggle('hidden');
      iconClose.classList.toggle('hidden');
      menuBtn.setAttribute('aria-expanded', String(!isOpen));
    });
    mobileMenu.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        iconOpen.classList.remove('hidden');
        iconClose.classList.add('hidden');
      });
    });
  }

  // Scroll reveal animation
  const revealEls = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach((el) => observer.observe(el));
</script>

</body>
</html>
